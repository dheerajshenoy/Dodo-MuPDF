name: Bug Report
about: Report a reproducible bug.
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Reproduced on latest main
      description: Make sure the issue is reproducible on the latest `main` branch.
      options:
        - label: I have reproduced this on the latest `main` branch.
          required: true

  - type: checkboxes
    attributes:
      label: Searched existing issues
      description: Search existing issues to avoid duplicates.
      options:
        - label: I have searched existing issues for duplicates.
          required: true

  - type: dropdown
    attributes:
      label: Application type
      description: Select the type of application you are reporting a bug for.
      options:
        - Native application
        - AppImage
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Custom configuration used
      options:
        - label: I am using custom configuration.
          required: true

  - type: textarea
    id: custom_config
    attributes:
      label: Custom configuration
      description: |
        Paste your custom configuration here, or provide a link (e.g. GitHub Gist).
      placeholder: |
        # Paste config here
        # or https://gist.github.com/...
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Willing to contribute
      options:
        - label: I am willing to submit a pull request for this.
          required: false

  - type: input
    attributes:
      label: OS
      placeholder: "NixOS 24.11"
    validations:
      required: true

  - type: input
    attributes:
      label: Qt version
      description: "`qmake6 --version`"
      placeholder: "6.8.1"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF with ...
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs / screenshots
    validations:
      required: true
